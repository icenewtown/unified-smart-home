title: 我的家
views:
  - title: 首页
    path: home
    cards:
      - type: markdown
        content: |-
          # 🏠 我的家
          统一控制小米 / 美的 / 格力设备
      - type: thermostat
        entity: climate.kong_diao_0601
        name: 格力空调
      - type: entities
        title: 空调功能
        entities:
          - entity: switch.kong_diao_0601
            name: 面板灯
          - entity: switch.kong_diao_0601_2
            name: 静音
          - entity: switch.kong_diao_0601_3
            name: 新风
          - entity: switch.kong_diao_0601_4
            name: XFan 干燥
          - entity: switch.kong_diao_0601_5
            name: 健康模式
      - type: button
        entity: script.shutdown_all_ac
        name: 全屋关空调
        icon: mdi:air-conditioner-off
        show_state: false
      - type: entities
        title: 美的滚筒洗衣机
        entities:
          - entity: switch.gun_tong_xi_yi_ji_dian_yuan
            name: 电源
          - entity: select.gun_tong_xi_yi_ji_cheng_xu
            name: 程序
          - entity: switch.gun_tong_xi_yi_ji_qi_ting
            name: 启停
          - entity: sensor.gun_tong_xi_yi_ji_yun_xing_zhuang_tai
            name: 运行状态
          - entity: sensor.gun_tong_xi_yi_ji_jin_du
            name: 进度
          - entity: sensor.gun_tong_xi_yi_ji_sheng_yu_shi_jian
            name: 剩余时间
          - entity: select.gun_tong_xi_yi_ji_wen_du
            name: 温度
          - entity: select.gun_tong_xi_yi_ji_zhuan_su
            name: 转速
          - entity: select.gun_tong_xi_yi_ji_shui_wei
            name: 水位
          - entity: select.gun_tong_xi_yi_ji_piao_xi_ci_shu
            name: 漂洗次数
          - entity: switch.gun_tong_xi_yi_ji_feng_gan
            name: 风干
          - entity: lock.gun_tong_xi_yi_ji_tong_suo
            name: 童锁
      - type: glance
        title: 米家温湿度计3
        entities:
          - entity: sensor.miaomiaoce_t9_2479_temperature
            name: 温度
          - entity: sensor.miaomiaoce_t9_2479_relative_humidity
            name: 湿度
          - entity: sensor.miaomiaoce_t9_2479_battery_level
            name: 电量
      - type: history-graph
        title: 温湿度 24 小时趋势
        hours_to_show: 24
        entities:
          - entity: sensor.miaomiaoce_t9_2479_temperature
            name: 温度
          - entity: sensor.miaomiaoce_t9_2479_relative_humidity
            name: 湿度
      - type: media-control
        entity: media_player.xiaomi_v1_81fb_play_control
      - type: entities
        title: 客厅小米电视
        entities:
          - entity: number.xiaomi_v1_81fb_volume
            name: 音量
          - entity: text.xiaomi_v1_81fb_post
            name: 发送文字
      - type: horizontal-stack
        cards:
          - type: button
            name: 电源
            icon: mdi:power
            styles:
              card:
                - height: 70px
              icon:
                - width: 34px
              name:
                - font-size: 17px
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.xiaomi_v1_81fb_keycodes
              data:
                option: power
          - type: button
            name: 首页
