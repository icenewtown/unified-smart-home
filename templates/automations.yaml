# ============================================================
# 小爱音箱玩法基础包
# 1) 洗衣机完成提醒  2) 早间播报  3) 晚安模式  4) 语音离家/回家
# 说明：
# - conversation 传感器轮询小米云对话记录（约 5 秒），状态值为用户对小爱说的最后一句话
# - 语音触发为关键词匹配，若误触发可调整各自动化 condition 中的关键词列表
# ============================================================

- id: washer_running_flag
  alias: 洗衣机运行标记
  description: 洗衣机进入运行/暂停状态时打开标记，供完成提醒判断是否真正洗过
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: sensor.gun_tong_xi_yi_ji_yun_xing_zhuang_tai
      to:
        - start
        - pause
  condition: []
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.washer_running

- id: washer_done_alert
  alias: 洗衣机完成提醒
  description: 洗衣机真正运行超过 5 分钟后回到空闲/待机，才播报完成
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: sensor.gun_tong_xi_yi_ji_yun_xing_zhuang_tai
  condition:
    - condition: template
      value_template: >-
        {{ trigger.from_state is not none
           and trigger.from_state.state not in ['unavailable', 'unknown', '']
           and trigger.to_state.state in ['idle', 'standby']
           and states('input_boolean.washer_running') == 'on'
           and (now() - states.input_boolean.washer_running.last_changed).total_seconds() > 300 }}
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.washer_running
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: 衣服洗好了，请及时晾晒
    - if:
        - condition: template
          value_template: "{{ states('device_tracker.xiao_mi_shou_ji_ha') not in ['unknown', 'unavailable', ''] }}"
      then:
        - service: notify.xiao_mi_shou_ji_ha
          data:
            title: 洗衣机
            message: 衣服洗好了，请及时晾晒
- id: morning_briefing
  alias: 早间播报
  description: 每天早上 7:30，用小爱音箱播报室内温湿度与今日天气
  mode: single
  trigger:
    - platform: time
      at: "07:30:00"
  action:
    - service: weather.get_forecasts
      data:
        type: daily
      target:
        entity_id: weather.forecast_wo_de_jia
      response_variable: weather_forecast
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: >-
          {% set wf = weather_forecast if weather_forecast is defined else {} %}
          {% set fc = wf.get('weather.forecast_wo_de_jia', {}).get('forecast') or [] %}
          {% set today = fc[0] if fc else {} %}
          {% set t = states('sensor.miaomiaoce_t9_2479_temperature') %}
          {% set h = states('sensor.miaomiaoce_t9_2479_relative_humidity') %}
          早上好。现在室内温度 {{ t if t not in ['unknown', 'unavailable'] else '--' }} 度，湿度 {{ h if h not in ['unknown', 'unavailable'] else '--' }}%。
          今天最高气温 {{ today.temperature | default('--') }} 度，最低 {{ today.templow | default('--') }} 度，降雨概率 {{ today.precipitation_probability | default('--') }}%。祝您今天心情愉快。
- id: goodnight_mode
  alias: 晚安模式
  description: 每天 23:00 或对小爱说“晚安”时，关闭电视并语音道晚安
  mode: single
  max_exceeded: silent
  trigger:
    - platform: time
      at: "23:00:00"
    - platform: state
      entity_id: sensor.xiaomi_l05b_1935_conversation
  condition:
    - condition: template
      value_template: >-
        {{ trigger.platform == 'time'
           or (trigger.to_state is defined and trigger.to_state and '晚安' in trigger.to_state.state) }}
    - condition: template
      value_template: >-
        {% set lt = state_attr('automation.wan_an_mo_shi', 'last_triggered') %}
        {{ lt is none or (now() - lt).total_seconds() > 600 }}
  action:
    - service: media_player.turn_off
      target:
        entity_id: media_player.xiaomi_v1_81fb_play_control
    - service: media_player.media_pause
      target:
        entity_id: media_player.xiaomi_l05b_1935_play_control
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: 晚安，好梦

- id: voice_leave_home
  alias: 语音离家模式
  description: 对小爱说“我出门了/我去上班了”等，关闭全屋空调与电视
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: sensor.xiaomi_l05b_1935_conversation
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state is defined and trigger.to_state
           and ('我出门了' in trigger.to_state.state
                or '我走了' in trigger.to_state.state
                or '我去上班了' in trigger.to_state.state
                or '我上班去了' in trigger.to_state.state) }}
    - condition: template
      value_template: >-
        {% set lt = state_attr('automation.voice_leave_home', 'last_triggered') %}
        {{ lt is none or (now() - lt).total_seconds() > 300 }}
  action:
    - service: script.shutdown_all_ac
    - service: media_player.turn_off
      target:
        entity_id: media_player.xiaomi_v1_81fb_play_control
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: 好的，空调和电视已关闭，一路平安

- id: voice_return_home
  alias: 语音回家播报
  description: 对小爱说“我回来了/我到家了”等，语音欢迎回家
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: sensor.xiaomi_l05b_1935_conversation
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state is defined and trigger.to_state
           and ('我回来了' in trigger.to_state.state
                or '我到家了' in trigger.to_state.state
                or '我下班了' in trigger.to_state.state) }}
    - condition: template
      value_template: >-
        {% set lt = state_attr('automation.voice_return_home', 'last_triggered') %}
        {{ lt is none or (now() - lt).total_seconds() > 300 }}
  action:
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: 欢迎回家，辛苦了

# ================= 第一批扩展（手机围栏/自动温控/故障提醒/语音查询/忘关提醒） =================

- id: presence_leave_home
  alias: 手机离家自动收尾
  description: 手机离开家区域后，自动关闭空调与电视（注意：目前仅以你的手机作为离家判断，若爸妈在家而你出门会触发，建议后续加入爸妈手机后再改为全员离家才触发）
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: device_tracker.xiao_mi_shou_ji_ha
      to: not_home
  condition:
    - condition: template
      value_template: "{{ trigger.from_state is not none and trigger.from_state.state == 'home' }}"
  action:
    - service: script.shutdown_all_ac
    - service: media_player.turn_off
      target:
        entity_id: media_player.xiaomi_v1_81fb_play_control

- id: presence_return_home
  alias: 手机回家欢迎播报
  description: 手机进入家区域后，小爱播报欢迎
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: device_tracker.xiao_mi_shou_ji_ha
      to: home
  condition:
    - condition: template
      value_template: "{{ trigger.from_state is not none and trigger.from_state.state == 'not_home' }}"
    - condition: template
      value_template: >-
        {% set lt = state_attr('automation.shou_ji_hui_jia_huan_ying_bo_bao', 'last_triggered') %}
        {{ lt is none or (now() - lt).total_seconds() > 300 }}
  action:
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: 欢迎回家

- id: ac_auto_control
  alias: 空调自动温控
  description: 自动温控开关开启时，室内 ≥29°C 且空调未开则自动开 26°C 制冷；≤24°C 且空调开着则关闭
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: sensor.miaomiaoce_t9_2479_temperature
    - platform: state
      entity_id: input_boolean.ac_auto_control
      to: "on"
  condition:
    - condition: state
      entity_id: input_boolean.ac_auto_control
      state: "on"
    - condition: template
      value_template: "{{ states('climate.kong_diao_0601') not in ['unavailable', 'unknown', ''] }}"
  action:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: sensor.miaomiaoce_t9_2479_temperature
              above: 28.9
            - condition: state
              entity_id: climate.kong_diao_0601
              state: "off"
          sequence:
            - service: climate.turn_on
              target:
                entity_id: climate.kong_diao_0601
            - service: climate.set_hvac_mode
              target:
                entity_id: climate.kong_diao_0601
              data:
                hvac_mode: cool
            - service: climate.set_temperature
              target:
                entity_id: climate.kong_diao_0601
              data:
                temperature: 26
        - conditions:
            - condition: numeric_state
              entity_id: sensor.miaomiaoce_t9_2479_temperature
              below: 24.1
            - condition: template
              value_template: "{{ states('climate.kong_diao_0601') != 'off' }}"
          sequence:
            - service: climate.turn_off
              target:
                entity_id: climate.kong_diao_0601

- id: washer_error_alert
  alias: 洗衣机故障提醒
  description: 洗衣机错误代码非 0 时，播报并推送
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: sensor.gun_tong_xi_yi_ji_cuo_wu_dai_ma
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state not in ['0', 'unknown', 'unavailable', ''] }}"
  action:
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: 洗衣机出现故障，请检查一下
    - if:
        - condition: template
          value_template: "{{ states('device_tracker.xiao_mi_shou_ji_ha') not in ['unknown', 'unavailable', ''] }}"
      then:
        - service: notify.xiao_mi_shou_ji_ha
          data:
            title: 洗衣机故障
            message: 洗衣机错误代码 {{ trigger.to_state.state }}，请检查

- id: washer_detergent_alert
  alias: 洗衣液不足提醒
  description: 洗衣液存量传感器变 on 时提醒（若语义相反请告知调整）
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: binary_sensor.gun_tong_xi_yi_ji_xi_yi_ye_cun_liang
      to: "on"
  action:
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: 洗衣液快用完了，记得添加
    - if:
        - condition: template
          value_template: "{{ states('device_tracker.xiao_mi_shou_ji_ha') not in ['unknown', 'unavailable', ''] }}"
      then:
        - service: notify.xiao_mi_shou_ji_ha
          data:
            title: 洗衣液不足
            message: 洗衣机洗衣液快用完了，记得添加

- id: voice_temp_report
  alias: 语音报温度
  description: 对小爱说“报告温度/温度多少”等，播报室内温湿度
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: sensor.xiaomi_l05b_1935_conversation
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state is defined and trigger.to_state
           and ('报告温度' in trigger.to_state.state
                or '温度多少' in trigger.to_state.state
                or '现在多少度' in trigger.to_state.state
                or '室内多少度' in trigger.to_state.state) }}
    - condition: template
      value_template: >-
        {% set lt = state_attr('automation.yu_yin_bao_wen_du', 'last_triggered') %}
        {{ lt is none or (now() - lt).total_seconds() > 300 }}
  action:
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: >-
          {% set t = states('sensor.miaomiaoce_t9_2479_temperature') %}
          {% set h = states('sensor.miaomiaoce_t9_2479_relative_humidity') %}
          现在室内温度 {{ t if t not in ['unknown', 'unavailable'] else '--' }} 度，湿度 {{ h if h not in ['unknown', 'unavailable'] else '--' }}%。

- id: voice_washer_status
  alias: 语音查洗衣机
  description: 对小爱说“洗衣机还有多久/好了没”等，播报运行状态与剩余时间
  mode: single
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: sensor.xiaomi_l05b_1935_conversation
  condition:
    - condition: template
      value_template: >-
        {{ trigger.to_state is defined and trigger.to_state
           and '洗衣机' in trigger.to_state.state
           and ('多久' in trigger.to_state.state or '多长' in trigger.to_state.state or '好了' in trigger.to_state.state) }}
    - condition: template
      value_template: >-
        {% set lt = state_attr('automation.yu_yin_cha_xi_yi_ji', 'last_triggered') %}
        {{ lt is none or (now() - lt).total_seconds() > 300 }}
  action:
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: >-
          {% set st = states('sensor.gun_tong_xi_yi_ji_yun_xing_zhuang_tai') %}
          {% set rm = states('sensor.gun_tong_xi_yi_ji_sheng_yu_shi_jian') %}
          {% if st in ['start', 'pause'] and rm not in ['unknown', 'unavailable', ''] %}
            洗衣机正在运行，预计还剩 {{ rm }} 分钟。
          {% elif st in ['start', 'pause'] %}
            洗衣机正在运行。
          {% else %}
            洗衣机当前没有在运行。
          {% endif %}

- id: late_night_reminder
  alias: 深夜忘关提醒
  description: 每天 23:30，电视还开着则语音提醒；空调还开着则推送手机
  mode: single
  max_exceeded: silent
  trigger:
    - platform: time
      at: "23:30:00"
  action:
    - if:
        - condition: template
          value_template: "{{ states('media_player.xiaomi_v1_81fb_play_control') not in ['off', 'unavailable', 'unknown', ''] }}"
      then:
        - service: text.set_value
          target:
            entity_id: text.xiaomi_l05b_1935_play_text
          data:
            value: 电视还开着，请记得关闭
    - if:
        - condition: template
          value_template: "{{ states('climate.kong_diao_0601') not in ['off', 'unavailable', 'unknown', ''] }}"
      then:
        - if:
            - condition: template
              value_template: "{{ states('device_tracker.xiao_mi_shou_ji_ha') not in ['unknown', 'unavailable', ''] }}"
          then:
            - service: notify.xiao_mi_shou_ji_ha
              data:
                title: 空调未关
                message: 晚上 23:30 空调还开着，请确认是否需要关闭
# ================= AI 语音助手（DeepSeek 对话桥，待 API key 激活） =================

- id: ai_voice_bridge
  alias: AI 语音助手
  description: 捕获小爱听不懂的非设备指令，交给 DeepSeek 回答并播报；已有语音命令不重复处理
  mode: queued
  max_exceeded: silent
  trigger:
    - platform: state
      entity_id: sensor.xiaomi_l05b_1935_conversation
  condition:
    - condition: template
      value_template: >-
        {% set q = trigger.to_state.state if trigger.to_state is defined and trigger.to_state else '' %}
        {% set known = ['晚安', '我出门了', '我走了', '我去上班了', '我上班去了', '我回来了', '我到家了', '我下班了', '报告温度', '温度多少', '现在多少度', '室内多少度', '打开洗衣机', '关闭洗衣机', '全屋关空调', '打开空调', '关闭空调'] %}
        {{ q | length > 1
           and not ('洗衣机' in q and ('多久' in q or '多长' in q or '好了' in q))
           and (known | select('in', q) | list | length) == 0 }}
  action:
    - variables:
        cid: "{{ states('input_text.ai_conversation_id') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ cid not in ['', 'unknown', 'unavailable', 'none', 'None'] }}"
          sequence:
            - service: conversation.process
              data:
                agent_id: conversation.deepseek
                text: "{{ trigger.to_state.state }}"
                conversation_id: "{{ cid }}"
              response_variable: ai_reply
      default:
        - service: conversation.process
          data:
            agent_id: conversation.deepseek
            text: "{{ trigger.to_state.state }}"
          response_variable: ai_reply
    - service: input_text.set_value
      target:
        entity_id: input_text.ai_conversation_id
      data:
        value: "{{ ai_reply.conversation_id | default('', true) }}"
    - service: text.set_value
      target:
        entity_id: text.xiaomi_l05b_1935_play_text
      data:
        value: >-
          {% set resp = ai_reply.response %}
          {{ resp.speech.plain.speech if resp.speech else resp.response }}
          {{ resp.speech.plain.speech if resp.speech else resp.response }}
          {{ resp.speech.plain.speech if resp.speech else resp.response }}
