                - height: 100px
              icon:
                - width: 44px
              name:
                - font-size: 24px
            tap_action:
              action: perform-action
              perform_action: climate.set_temperature
              target:
                entity_id: climate.wo_shi_de_ge_li_kong_diao
              data:
                temperature: 26
          - type: button
            name: 24度
            icon: mdi:thermometer
            styles:
              card:
                - height: 100px
              icon:
                - width: 44px
              name:
                - font-size: 24px
            tap_action:
              action: perform-action
              perform_action: climate.set_temperature
              target:
                entity_id: climate.wo_shi_de_ge_li_kong_diao
              data:
                temperature: 24
          - type: button
