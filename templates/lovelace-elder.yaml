          - type: button
            name: 自动
            icon: mdi:autorenew
            styles:
              card:
                - height: 90px
              icon:
                - width: 40px
              name:
                - font-size: 22px
            tap_action:
              action: perform-action
              perform_action: climate.set_hvac_mode
              target:
                entity_id: climate.wo_shi_de_ge_li_kong_diao
              data:
                hvac_mode: auto
      - type: markdown
        content: |-
          ### 洗衣机
      - type: horizontal-stack
        cards:
          - type: button
            entity: switch.gun_tong_xi_yi_ji_dian_yuan
            name: 洗衣机电源
            icon: mdi:washing-machine
            show_state: true
            styles:
              card:
                - height: 130px
              icon:
                - width: 60px
              name:
                - font-size: 26px
                - font-weight: bold
            tap_action:
              action: toggle
          - type: button
            entity: switch.gun_tong_xi_yi_ji_qi_ting
            name: 启动 / 停止
            icon: mdi:play-pause
            show_state: true
            styles:
              card:
                - height: 130px
              icon:
                - width: 60px
              name:
                - font-size: 26px
                - font-weight: bold
            tap_action:
              action: toggle
      - type: entities
        title: 洗衣机状态
        entities:
          - entity: sensor.gun_tong_xi_yi_ji_yun_xing_zhuang_tai
            name: 运行状态
          - entity: sensor.gun_tong_xi_yi_ji_sheng_yu_shi_jian
            name: 剩余时间
          - entity: sensor.gun_tong_xi_yi_ji_jin_du
            name: 进度
      - type: markdown
        content: |-
          ### 电视
      - type: horizontal-stack
        cards:
          - type: button
            name: 打开电视
            icon: mdi:television
            styles:
              card:
                - height: 110px
              icon:
                - width: 52px
              name:
                - font-size: 26px
            tap_action:
              action: perform-action
              perform_action: media_player.turn_on
              target:
                entity_id: media_player.xiaomi_v1_81fb_play_control
          - type: button
            name: 关闭电视
            icon: mdi:television-off
            styles:
              card:
                - height: 110px
              icon:
                - width: 52px
              name:
                - font-size: 26px
            tap_action:
              action: perform-action
              perform_action: media_player.turn_off
              target:
                entity_id: media_player.xiaomi_v1_81fb_play_control
      - type: horizontal-stack
        cards:
          - type: button
            name: 音量+
            icon: mdi:volume-high
            styles:
              card:
                - height: 100px
              icon:
                - width: 44px
              name:
                - font-size: 24px
            tap_action:
              action: perform-action
              perform_action: media_player.volume_up
              target:
                entity_id: media_player.xiaomi_v1_81fb_play_control
          - type: button
            name: 音量-
            icon: mdi:volume-low
            styles:
              card:
                - height: 100px
              icon:
                - width: 44px
              name:
                - font-size: 24px
            tap_action:
              action: perform-action
              perform_action: media_player.volume_down
              target:
                entity_id: media_player.xiaomi_v1_81fb_play_control
      - type: horizontal-stack
        cards:
          - type: button
            name: 首页
            icon: mdi:home
            styles:
              card:
                - height: 100px
              icon:
                - width: 44px
              name:
                - font-size: 24px
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.xiaomi_v1_81fb_keycodes
              data:
                option: home
          - type: button
            name: 返回
            icon: mdi:arrow-left
            styles:
              card:
                - height: 100px
              icon:
                - width: 44px
              name:
                - font-size: 24px
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.xiaomi_v1_81fb_keycodes
              data:
                option: back
          - type: button
            name: 播放暂停
            icon: mdi:play-pause
            styles:
              card:
                - height: 100px
              icon:
                - width: 44px
              name:
                - font-size: 24px
            tap_action:
              action: perform-action
              perform_action: select.select_option
              target:
                entity_id: select.xiaomi_v1_81fb_keycodes
              data:
                option: play_pause