            tap_action:
              action: perform-action
              perform_action: climate.set_temperature
              target:
                entity_id: climate.wo_shi_de_ge_li_kong_diao
              data:
                temperature: 28
      - type: horizontal-stack
        cards:
          - type: button
            name: 制冷
            icon: mdi:snowflake
            styles:
              card:
                - height: 90px
              icon:
                - width: 40px
              name:
                - font-size: 22px
            tap_action:
              action: perform-action
              perform_action: climate.set_hvac_mode
              target:
                entity_id: climate.wo_shi_de_ge_li_kong_diao
              data:
